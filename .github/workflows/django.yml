name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Run Black Check
      run: black --check . --exclude=venv

    - name: Run Flake8 Check
      run: flake8 . --exclude=venv,*/migrations/* --max-line-length=120

  tests:
    runs-on: ubuntu-latest
    needs: linting
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Coverage
      env:
        DJANGO_SETTINGS_MODULE: config.development
        SECRET_KEY: 'test-key-for-ci-only'
      run: |
        pytest --cov=. --cov-report=term-missing

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-library-web:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/my-library-web:${{ github.sha }}