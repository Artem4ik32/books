{% extends "base.html" %}

{% block content %}
<h2>Cart</h2>

{% for item in cart %}
<p>
    {{ item.book.title }} - {{ item.quantity }} x {{ item.price }}
    <a href="{% url 'shop:cart_remove' item.book.id %}">Remove</a>
</p>
{% endfor %}

<a href="{% url 'shop:checkout' %}" class="btn btn-success">Pay with Stripe</a>

{% endblock %}
